name: windows-release
# Publishing a release (not a pre-release) on GitHub builds the Windows installer for its tag and attaches it to the
# release: ASM-Setup-<version>.exe. Programs that are already installed see the release through the GitHub API, and
# offer the update once the installer is attached (src/arctis_sound_manager/win/updates.py).
#
#   1. Releases > Draft a new release > choose a tag such as v1.7.0 (target: the windows branch) > Publish release
#   2. about ten minutes later the installer is attached to it
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to build the installer for again"
        required: true
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  installer:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Which release
        id: rel
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: installer/requirements.txt }
      - name: Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r installer/requirements.txt
          python -m pip install --no-deps pyrnnoise
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ steps.rel.outputs.version }}"
      - name: Smoke test of the frozen program (not installed)
        shell: pwsh
        continue-on-error: true
        run: ./ci/smoke_frozen.ps1 -AppDir build\dist\ArctisSoundManager
      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: gh release upload "$TAG" build/ASM-Setup-*.exe --clobber
