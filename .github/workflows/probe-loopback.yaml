name: probe-loopback
on:
  push:
    branches: [ci-probe]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-loopback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Process-loopback / VB-CABLE experiments
        shell: pwsh
        timeout-minutes: 15
        run: ./ci/probe_loopback.ps1
        continue-on-error: true
      - name: Annotate
        if: always()
        shell: pwsh
        run: ./ci/annotate.ps1 -Files loopback.log
      - name: Publish
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-loopback-${{ matrix.os }} loopback.log hang-*.png
