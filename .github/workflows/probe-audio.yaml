name: probe-audio
on:
  push:
    branches: [ci-probe]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static look at the drivers' signatures
        shell: pwsh
        timeout-minutes: 8
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./ci/probe_static.ps1
        continue-on-error: true
      - name: Annotate
        if: always()
        shell: pwsh
        run: ./ci/annotate.ps1 -Files static.log
      - name: Publish
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-static static.log
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
        which: [vad, vbcable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.which }}
        shell: pwsh
        timeout-minutes: 12
        env: { GH_TOKEN: "${{ github.token }}" }
        run: ./ci/probe_install.ps1 -Which ${{ matrix.which }}
        continue-on-error: true
      - name: Annotate
        if: always()
        shell: pwsh
        run: ./ci/annotate.ps1 -Files install-${{ matrix.which }}.log
      - name: Publish
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-${{ matrix.which }}-${{ matrix.os }} install-${{ matrix.which }}.log hang-*.png
