name: windows-installer
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: installer/requirements.txt }
      - name: Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r installer/requirements.txt
          python -m pip install --no-deps pyrnnoise
          python -m pip list
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 *>&1 | Tee-Object -FilePath build.log
      - name: Smoke test of the frozen program (not installed)
        shell: pwsh
        continue-on-error: true
        run: ./ci/smoke_frozen.ps1 -AppDir build\dist\ArctisSoundManager
      - name: Publish logs
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-installer smoke.log build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ASM-Setup
          path: build/ASM-Setup-*.exe
      - name: Publish the installer as a pre-release
        if: github.ref == 'refs/heads/windows'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest build/ASM-Setup-*.exe --prerelease --target "$GITHUB_SHA" \
            --title "Windows installer (latest build of the windows branch)" \
            --notes "Unsigned installer built by CI from commit $GITHUB_SHA. Windows SmartScreen will warn about an unknown publisher: choose More info > Run anyway."
