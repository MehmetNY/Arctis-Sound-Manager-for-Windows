name: windows-installer
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: installer/requirements.txt }
      - name: Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r installer/requirements.txt
          python -m pip install --no-deps pyrnnoise
          python -m pip list
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 *>&1 | Tee-Object -FilePath build.log
      - name: Smoke test of the frozen program (not installed)
        shell: pwsh
        continue-on-error: true
        run: ./ci/smoke_frozen.ps1 -AppDir build\dist\ArctisSoundManager
      - name: Publish logs
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-installer smoke.log build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ASM-Setup
          path: build/ASM-Setup-*.exe
      - name: Publish the installer as a pre-release
        if: github.ref == 'refs/heads/windows'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest build/ASM-Setup-*.exe --prerelease --target "$GITHUB_SHA" \
            --title "Windows installer (latest build of the windows branch)" \
            --notes "Unsigned installer built by CI from commit $GITHUB_SHA. Windows SmartScreen will warn about an unknown publisher: choose More info > Run anyway."

  chain:
    # The installer exactly as a user gets it, on a clean machine: silent installation (VB-CABLE included), the program
    # started the way "Start with Windows" starts it, real programs playing, the engine mixing, the uninstaller.
    needs: installer
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install numpy psutil
      - uses: actions/download-artifact@v4
        with: { name: ASM-Setup, path: installer-exe }
      - name: Build the native test tools
        shell: pwsh
        run: ./ci/build_native.ps1
      - name: Install silently
        shell: pwsh
        timeout-minutes: 10
        run: ./ci/chain_install.ps1 -Installer (Get-ChildItem installer-exe -Filter "ASM-Setup-*.exe" | Select-Object -First 1).FullName
      - name: Whole chain
        shell: pwsh
        timeout-minutes: 20
        run: python ci/e2e_chain.py
        continue-on-error: true
      - name: Annotate
        if: always()
        shell: pwsh
        run: ./ci/annotate.ps1 -Files chain.log,chain-install.log
      - name: Publish
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-chain chain.log chain-install.log chain-setup.log

  soak:
    # Does the installed program grow? Every ASM process sampled for a while on a real Windows machine (memory, CPU, handles,
    # GDI objects): phase 1 with the window open and cycling through its pages, phase 2 without a headset and with the window
    # closed (the tray must replace itself, the engine must not keep probing). See ci/soak.py.
    needs: installer
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install numpy psutil
      - uses: actions/download-artifact@v4
        with: { name: ASM-Setup, path: installer-exe }
      - name: Build the native test tools
        shell: pwsh
        run: ./ci/build_native.ps1
      - name: Install silently
        shell: pwsh
        timeout-minutes: 10
        run: ./ci/chain_install.ps1 -Installer (Get-ChildItem installer-exe -Filter "ASM-Setup-*.exe" | Select-Object -First 1).FullName
      - name: Soak
        shell: pwsh
        timeout-minutes: 32
        run: python ci/soak.py 12
        continue-on-error: true
      - name: Annotate
        if: always()
        shell: pwsh
        run: ./ci/annotate.ps1 -Files soak.log
      - name: Publish
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-soak soak.log chain-install.log

  media:
    # Does asking Windows "what is playing?" (the DAC's media line, polled every OLED tick by the daemon) leak? A real media
    # session with a thumbnail is published and polled through win/media.py thousands of times. See ci/media_soak.py.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install psutil winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Media.Control winrt-Windows.Media.Playback winrt-Windows.Storage.Streams
      - name: Poll the media line
        shell: pwsh
        timeout-minutes: 10
        run: python ci/media_soak.py | Tee-Object -FilePath media.log
        continue-on-error: true
      - name: Annotate
        if: always()
        shell: pwsh
        run: ./ci/annotate.ps1 -Files media.log
      - name: Publish
        if: always()
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: ./ci/publish.sh ci-logs-media media.log
