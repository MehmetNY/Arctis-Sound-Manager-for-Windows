; filter-chain safe-mode banner (issue #88)
safe_mode_banner=Güvenli mod açık: ses filtre zinciri çöktüğü için ekolayzer devre dışı bırakıldı. Sorun ortadan kalktıysa (örneğin bir güncelleme sonrası), yeniden etkinleştirebilirsiniz.
