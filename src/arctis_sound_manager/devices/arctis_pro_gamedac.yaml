# Arctis Pro + GameDAC — the wired DAC base station (issue #213).
#
# Split out of arctis_7.yaml, which it shared with the Arctis 7 dongle and
# whose protocol is not its own. Every value here is read from SteelSeries'
# own specification for this product (arctis-pro-gameDac.device), not carried
# over by analogy.
#
# What the shared profile got wrong, and what it cost:
#
# * It declared USB interface 5, the Arctis 7 dongle's. This device exposes
#   0, 1 and 2, so every command failed with ENOENT twice a second for as
#   long as it was plugged in, and its status came back as the empty
#   sentinel while the headset was plainly on.
# * It asked for battery (0x0618). A GameDAC is mains-powered through USB and
#   reports none — the spec has no headset_status struct at all, which is the
#   giveaway that this is a base station rather than a headset.
# * It read ChatMix from command 0x24. This device pushes 0x45.
device:
  name: SteelSeries Arctis Pro GameDAC
  # GG's own minimum spacing between commands for this firmware family.
  time_between_commands_ms: 50
  # GG's own wait after the transmitter enumerates before sending it any
  # command at all (init-sleep-length) — the firmware itself is still
  # booting for this long.
  init_sleep_length_ms: 5000
  vendor_id: 0x1038
  product_ids:
    # The GameDAC presents itself as several USB products. 0x1280 carries HID
    # interfaces 0, 1 and 2; 0x1282 — "GameDAC Chat" in SteelSeries' own
    # specification, and the device's chat audio — carries interface 5, the
    # one the old shared profile named. It was listed nowhere here, so udev
    # granted it nothing and a report showed it as "no permission": the udev
    # rules are generated from these ids (#213).
    - 0x1280 # Arctis Pro GameDAC — control (HID interfaces 0, 1, 2)
    - 0x1282 # Arctis Pro GameDAC — chat audio + HID interface 5

  command_padding:
    length: 62
    position: end
    filler: 0x00

  # The spec's APIs are all `(chunk HIDIO 65 payload)`: one report-id byte and
  # 64 of data. With report_id a constant 0x00 the reports are unnumbered, so
  # nothing of it goes on the wire and the wValue low byte stays 0.
  command_transport: ctrl_output
  command_report_id: 0x00

  # Inferred, not read: the USB layout is in no SteelSeries specification —
  # their `sync-interface` is not the bInterfaceNumber, as the Nova 7 Gen 2
  # already showed. Of this device's three HID interfaces (0, 1, 2) the
  # 4-byte one is a dial or volume control and interface 2 is the usual place
  # for the vendor channel. If it is wrong the daemon moves off it on the
  # first ENOENT and says so in the log; scripts/reverse-engineering/
  # gamedac_status_probe.py settles it on real hardware.

  # No hid_usage_page here on purpose. The value that used to be here came from
  # the spec's `(sync-interface ...)`, which is a different declaration from
  # `(usage-page ...)`: the first names the interface that pushes events, the
  # second the interface commands go to. SteelSeries' own engine treats them as
  # two primitives taking different arguments. Naming the sync interface's page
  # as the command interface's is what shipped 1.4.10 (#216, #217). Absent is
  # honest here; a wrong page would be used to choose between vendor interfaces.

  command_interface_index: [2, 0]
  listen_interface_indexes: [2]

  device_init:
    - ['status.request']   # get_audio_settings — command 0x20

  status:
    # [report_id, command] like every other profile here: the Nova Pro
    # Wireless writes 0x06b0 for its own report id 0x06 and command 0xb0.
    # This device's report id is 0x00.
    request: 0x0020

    response_mapping:
      # hp_speaker_mix. The same command as the Nova Pro Wireless's ChatMix
      # frame, and the same shape: the spec's own event handler for 0x45
      # reads game from byte 2 and chat from byte 3, which is exactly what
      # nova_pro_wireless.yaml declares. ASM's names for the two halves are
      # the firmware's, where "media" is the game side.
      - starts_with: 0x0045
        media_mix: 0x02
        chat_mix: 0x03

      # get_audio_settings. Sidetone sits past ten int32 EQ bands and the
      # int32 mic volume, so the offsets are counted rather than guessed:
      # command(1) host_mode(2) volume(3) dac_gain(4) volume_limiter(5)
      # surround(6) surround_offload(7) eq_preset(8) eq1..10(9-48)
      # mic_volume(49-52) sidetone(53).
      - starts_with: 0x0020
        mic_side_tone: 0x35

    representation:
      headset:
        - chat_mix
        - media_mix
      # Nothing of the base station's own to report, but its presence is what
      # gives the device a DAC page and an OLED manager.
      gamedac: []

  # The 128x52 OLED, from arctis-pro-gameDac.device (draw_bitmap,
  # reload_display, screen_brightness). Unlike the Nova Pro's panel, the
  # spec gives a fixed header — x 0, y 0, width 52, height 128 — and the
  # image in one HIDFEATURE chunk of 1025 bytes: the controller addresses
  # the panel rotated. GG packs it with convert-to-column-packed-byte-format-
  # with-LSB: 7 bytes per panel column, bottom pixel in bit 0 (read from its
  # disassembly, see OledProtocol._row_major_msb_to_rotated_lsb). Control reports
  # are HIDIO 65. Report id 0x00 means unnumbered, so each report is one
  # byte shorter on the wire than the spec's chunk.
  #
  # Not verified on hardware: the interface — the spec names a usage page,
  # not an interface number; 2 is the command interface above.
  oled:
    interface: 2
    report_id: 0x00
    wvalue: 0x0300
    width: 128
    height: 52
    frame_report_size: 1025
    control_report_size: 65
    transpose: true

  audio:
    spatial_engine: hesuvi

  # Read-only queries for `asm-cli tools probe` (generated from the
  # spec by gg_draft.py): their raw replies check a spec layout
  # on real hardware in one pass. Constants only — nothing is set.
  probe_queries:
    - name: get_audio_settings
      frame: [0x20]
      fields: {host_mode: 1, volume: 2, dac_gain: 3, volume_limiter: 4, surround: 5, surround_offload: 6, eq_preset: 7, custom_eq1: [8, 4], custom_eq2: [12, 4], custom_eq3: [16, 4], custom_eq4: [20, 4], custom_eq5: [24, 4], custom_eq6: [28, 4], custom_eq7: [32, 4], custom_eq8: [36, 4], custom_eq9: [40, 4], custom_eq10: [44, 4], mic_volume: [48, 4], sidetone: 52, mic_agc: 53, mic_noise_gate: 54, aux_mode: 55, line_out_mode: 56, hp_speaker_game: 57, hp_speaker_chat: 58, stream_game: 59, stream_chat: 60, stream_aux: 61, stream_mic: 62}
    - name: get_ux_settings
      frame: [0x80]
      fields: {timer_delay: [1, 4], active_brightness: 5, idle_brightness: 6, screensaver: 7}
    - name: get_preset_settings
      frame: [0xa0]
      fields: {left_preset: 1, right_preset: 2, mic_preset: 3, mute_preset: 4}

  settings:
    microphone:
      # side_tone, command 0x39 in the spec, one byte of level.
      mic_side_tone:
        type: slider
        min: 0x00
        max: 0x0a
        step: 1
        min_label: off
        max_label: perc_100
        default: 0x00
        update_sequence: [0x39, 'value']
